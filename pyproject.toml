[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sudoc-explorer"
version = "0.4.0"
description = "Exploration locale des collections du Sudoc"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "duckdb>=1.1,<2", "lxml>=5,<7"]

[tool.setuptools.packages.find]
where = ["src"]
